upstream backend {
    # 负载均衡：最少连接算法，适合长连接场景
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=30s;
    # 多实例扩展时取消注释：
    # server backend-2:8080 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# ============================================================
# HTTP → HTTPS 强制跳转
# ============================================================
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ============================================================
# HTTPS 主入口
# ============================================================
server {
    listen 443 ssl;
    server_name _;
    charset utf-8;

    # 自签证书（SAN: IP 121.40.235.227, localhost）
    ssl_certificate     /etc/nginx/certs/im-toy.crt;
    ssl_certificate_key /etc/nginx/certs/im-toy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 访问日志（生产环境建议关闭以提升性能）
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 客户端上传限制（图片消息）
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ============================================================
    # API 反向代理
    # ============================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ============================================================
    # WebSocket 反向代理（IM 长连接）
    # ============================================================
    location /room {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ============================================================
    # 健康检查端点
    # ============================================================
    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    # ============================================================
    # 前端静态资源
    # ============================================================
    # index.html 不缓存
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # config.js 不缓存（运行时配置可能变化）
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # JS 不缓存（无版本哈希，更新频繁；immutable 会卡住用户拿不到新代码）
    location ~* \.js$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 其他静态资源长期缓存
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 默认 fallback 到 index.html（SPA）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
