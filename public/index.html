<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微聊 · IM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/visual.css">
<link rel="stylesheet" href="styles/wechat.css">
</head>
<body>

<!-- 登录/注册 -->
<div id="authPage">
  <div class="auth-card">
    <div class="auth-logo">聊</div>
    <div class="auth-title">微聊</div>
    <p class="auth-subtitle">与你关心的人，保持联系</p>
    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">登录</button>
      <button type="button" id="tabReg">注册</button>
    </div>
    <div id="loginForm">
      <div class="field"><input id="loginUsername" placeholder="用户名" autocomplete="username"></div>
      <div class="field"><input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password"></div>
      <button class="btn-primary" type="button" id="loginBtn">登 录</button>
    </div>
    <div id="registerForm" class="hidden">
      <div class="field"><input id="regUsername" placeholder="用户名" autocomplete="username"></div>
      <div class="field"><input id="regNickname" placeholder="昵称"></div>
      <div class="field"><input id="regPassword" type="password" placeholder="密码" autocomplete="new-password"></div>
      <button class="btn-primary" type="button" id="regBtn">注 册</button>
    </div>
    <div id="authMsg"></div>
    <p id="apiHint"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <div class="mobile-backdrop" id="mobileBackdrop"></div>
  <nav class="app-rail" aria-label="主导航">
    <div class="rail-profile" id="railProfile" title="当前账号">我</div>
    <button class="rail-tab active" data-tab="friends" title="消息" aria-label="消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11c0 5-5 8-10 7l-5 3 1-5C0 10 5 3 12 3c5 0 9 3 9 8Z"/><path d="M7 10h10"/></svg></button>
    <button class="rail-tab" data-tab="requests" title="好友请求" aria-label="好友请求"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="4"/><path d="M2 21v-3c0-6 16-6 16 0v3ZM19 7h5M21.5 4.5v5"/></svg></button>
    <button class="rail-tab" data-tab="groups" title="群聊" aria-label="群聊"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="7" r="4"/><path d="M1 21v-3c0-6 16-6 16 0v3M16 3c6 0 6 8 0 8M19 14c3 1 4 3 4 7"/></svg></button>
    <button class="rail-logout" id="railLogout" title="退出登录" aria-label="退出登录">⏻</button>
  </nav>

  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="avatar online" id="meAvatar">我</div>
      <div class="side-me">
        <div class="nick" id="meNick">未登录</div>
        <div class="sub" id="meSub"></div>
      </div>
      <button class="icon-btn" id="searchBtn" title="搜索添加用户">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" title="退出登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <div class="sidebar-search">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="searchInput" aria-label="搜索用户并添加" placeholder="搜索用户并添加">
      </div>
    </div>
    <div class="side-tabs">
      <button class="active" data-tab="friends">消息</button>
      <button data-tab="requests">请求</button>
      <button data-tab="groups">群聊</button>
    </div>
    <div id="listArea"></div>
  </aside>

  <main id="chatArea">
    <header id="chatHeader">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
        <button class="icon-btn" id="menuBtn" type="button" title="打开会话列表" aria-label="打开会话列表">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="avatar chat-header-avatar" id="chatHeaderAvatar" aria-hidden="true" hidden></div>
        <div id="chatTitle">微聊</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearBtn" title="清屏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </header>

    <div id="chatMessages">
      <div class="empty-tip chat-empty" id="chatEmptyTip"><span class="chat-empty-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M8 22c0-8 7-14 16-14s16 6 16 14-7 14-16 14c-2 0-4-.3-6-1l-6 3 1-6c-3-2-5-6-5-10Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="18" cy="22" r="1.5" fill="currentColor"/><circle cx="24" cy="22" r="1.5" fill="currentColor"/><circle cx="30" cy="22" r="1.5" fill="currentColor"/></svg></span><strong>开始一段对话</strong><span>从左侧选择联系人或群聊</span></div>
    </div>

    <div id="chatInput">
      <div class="input-toolbar">
        <button class="icon-btn" id="emojiBtn" title="表情">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
        <button class="icon-btn" id="imageBtn" title="图片">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
      </div>
      <div class="input-row">
        <textarea id="messageInput" rows="1" aria-label="消息内容" placeholder="输入消息…"></textarea>
        <button class="btn-send" id="sendBtn" type="button" title="发送消息" aria-label="发送消息">
          发送
        </button>
      </div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script type="module" src="pages/chat.js"></script>
</body>
</html>
