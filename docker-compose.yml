version: '3.8'

services:
  # ============================================================
  # Nginx 统一入口：反向代理 + 静态资源 + WebSocket
  # ============================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - workspace_default
    command: >
      sh -c "chmod -R 755 /usr/share/nginx/html && nginx -g 'daemon off;'"

  # ============================================================
  # Go 后端
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    networks:
      - workspace_default

networks:
  workspace_default:
    external: true
