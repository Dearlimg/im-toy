# Server configuration
server:
  port: 8080
  mode: debug

# MySQL configuration
database:
  host: 127.0.0.1
  port: 3307
  username: imchat
  password: imchat-dev-only
  database: im_chat
  charset: utf8mb4
  max_idle_conns: 10   # 最大空闲连接数
  max_open_conns: 100  # 最大打开连接数

# Redis configuration
redis:
  host: 127.0.0.1
  port: 6380
  password: ""
  db: 0
  pool_size: 10

# Kafka configuration
kafka:
  brokers: [] # Legacy Kafka consumers are disabled.
  topic: "im_message"
  topics:
    group_msg_raw: "group-msg-raw"
    group_msg_publish: "group-msg-publish"
    private_msg: "private-msg"
    read_events: "read-events"

# JWT configuration
jwt:
  secret_key: "local-development-change-this-secret"
  expire: 1800  # seconds
  refresh: 604800  # seconds
