# Server configuration
server:
  port: 8080
  mode: debug

# MySQL configuration
mysql:
  host: localhost
  port: 3306
  username: root
  password: 123456
  database: im_chat
  charset: utf8mb4
  max_idle_conns: 10   # 最大空闲连接数
  max_open_conns: 100  # 最大打开连接数

# Redis configuration
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

# Kafka configuration
kafka:
  brokers:
    - "0.0.0.0:9092"
  topic: "im_message"
  topics:
    group_msg_raw: "group-msg-raw"
    group_msg_publish: "group-msg-publish"
    private_msg: "private-msg"
    read_events: "read-events"

# JWT configuration
jwt:
  access_secret: "im_chat_access_secret"
  refresh_secret: "im_chat_refresh_secret"
  access_expire: 1800  # 30 minutes in seconds
  refresh_expire: 604800  # 7 days in seconds